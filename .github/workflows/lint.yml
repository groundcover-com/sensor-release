name: lint

on:
  pull_request:
    paths:
      - "**.sh"
  push:
    branches: [main]
    paths:
      - "**.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: bash syntax check
        run: bash -n install.sh
      - name: shellcheck
        run: shellcheck install.sh
