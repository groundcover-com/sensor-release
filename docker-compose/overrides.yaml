# Merged on top of the release's config.yaml. Copy to /data/groundcover/config/overrides.yaml.
logs:
  scraper:
    # Read positions and delivery checkpoints live on the persistent state mount.
    positionsFile: /var/run/positions/positions.yaml
    journalConfig:
      # Journal logs are resent after an outage or a reboot, with their original timestamps.
      reliableDelivery:
        enabled: true
      # systemd-pstore logs each crash dump in the FILE field of its journal entry.
      serviceTargets:
        - serviceName: systemd-pstore
          contentField: FILE
exporters:
  remotewrite:
    # Metrics written while offline wait here and are sent, oldest first, after reconnect.
    tmpDataPath: /vmagent_pq/vmagent-remotewrite-data
    # When full, the oldest data is dropped. Unset, the sensor's default is 50GB.
    maxDiskUsagePerURL: 20GB
